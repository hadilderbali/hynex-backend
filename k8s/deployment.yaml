apiVersion: apps/v1
kind: Deployment
metadata:
  name: hynex-backend
  namespace: hynex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hynex-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hynex-backend
    spec:
      containers:
        - name: hynex-backend
          image: hynex-backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: hynex-config
                  key: datasource-url
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hynex-runtime-secrets
                  key: groq-api-key
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
