
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hynex-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hynex-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hynex-backend
    spec:
      containers:
        - name: hynex-backend
          image: hynex-backend:placeholder
          imagePullPolicy: Never
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: hynex-config
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hynex-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hynex-secrets
                  key: db-password
