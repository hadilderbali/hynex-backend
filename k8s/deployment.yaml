apiVersion: apps/v1
kind: Deployment
metadata:
  name: hynex-backend
  namespace: hynex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hynex-backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: hynex-backend
    spec:
      containers:
        - name: hynex-backend
          image: hynex-backend:placeholder
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8087

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: hynex-config
                  key: datasource-url

            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hynex-runtime-secrets
                  key: groq-api-key

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
